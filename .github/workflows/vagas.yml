name: Bot de vagas

on:
  schedule:
    - cron: "7 * * * *"   # a cada hora, no minuto 7 (UTC)
  workflow_dispatch: {}    # permite rodar manualmente pela aba Actions

permissions:
  contents: write

concurrency:
  group: vagas
  cancel-in-progress: false

jobs:
  buscar-e-enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Buscar vagas e enviar no Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
        run: python bot.py

      - name: Salvar histórico de vagas enviadas
        run: |
          git config user.name "vagas-bot"
          git config user.email "actions@github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "atualiza histórico de vagas [skip ci]"
          git push
